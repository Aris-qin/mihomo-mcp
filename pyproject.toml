[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mihomo-mcp"
version = "0.1.0-dev"
description = "Bridge mihomo (clash meta) RESTful API to Model Context Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Aris-qin", email = "Aris-qin@users.noreply.github.com" },
]
keywords = ["mcp", "mihomo", "clash", "proxy", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mihomo-mcp = "mihomo_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Aris-qin/mihomo-mcp"
Repository = "https://github.com/Aris-qin/mihomo-mcp"
Issues = "https://github.com/Aris-qin/mihomo-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mihomo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
